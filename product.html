<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BuildMart — Товар</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">

  <div id="header-root"></div>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-10 pt-20">
    <div class="text-sm text-gray-500 mb-6">
      <a href="index.html" class="hover:text-primary">Каталог</a> / <span id="breadcrumb-name"></span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
      <div>
        <div class="relative rounded-2xl overflow-hidden border border-gray-200 bg-white aspect-[4/3]">
          <img id="main-image" src="" alt="" class="absolute inset-0 w-full h-full object-cover transition-all duration-500 ease-in-out">
        </div>
        <div id="thumbnails" class="flex gap-4 mt-6 justify-center"></div>
      </div>

      <div>
        <h1 id="product-name" class="text-4xl font-bold text-gray-900"></h1>
        <div class="flex items-center gap-3 mt-4">
          <div id="rating-stars" class="flex text-yellow-400 text-3xl"></div>
          <span id="rating-text" class="text-gray-600 text-lg"></span>
        </div>
        <div id="product-price" class="text-5xl font-bold text-primary mt-6"></div>

        <div class="flex flex-wrap gap-8 mt-10">
          <div class="flex items-center gap-3">
            <span class="text-3xl">📦</span>
            <div>
              <div class="font-medium">Гарантия качества</div>
              <div class="text-sm text-gray-500">Материалы премиум-класса</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-3xl">🚚</span>
            <div>
              <div class="font-medium">Быстрая доставка</div>
              <div class="text-sm text-gray-500">2-5 рабочих дней</div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-3xl">🛡️</span>
            <div>
              <div class="font-medium">Возврат</div>
              <div class="text-sm text-gray-500">30 дней</div>
            </div>
          </div>
        </div>

        <div class="mt-10">
          <div class="text-base font-medium text-gray-700 mb-3">Количество</div>
          <div class="flex items-center border border-gray-300 rounded-lg w-fit">
            <button id="qty-minus" class="w-12 h-12 flex items-center justify-center text-2xl hover:bg-gray-100 transition">-</button>
            <input id="qty-input" type="text" value="1" class="w-16 text-center text-2xl font-medium focus:outline-none">
            <button id="qty-plus" class="w-12 h-12 flex items-center justify-center text-2xl hover:bg-gray-100 transition">+</button>
          </div>
        </div>

        <div class="mt-8 flex flex-col sm:flex-row gap-4">
          <button id="add-to-cart-btn" class="flex-1 bg-primary hover:bg-primary-dark text-white py-5 rounded-xl font-medium text-lg transition flex items-center justify-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Добавить в корзину
          </button>
          <button class="flex-1 border-2 border-primary text-primary hover:bg-primary/10 py-5 rounded-xl font-medium text-lg transition">
            Купить сейчас
          </button>
        </div>

        <div class="mt-12">
          <h2 class="text-2xl font-bold mb-4">Описание</h2>
          <div id="product-description" class="text-gray-700 leading-relaxed prose max-w-none"></div>
        </div>

        <div class="mt-12">
          <details class="group border border-gray-200 rounded-lg overflow-hidden">
            <summary class="flex justify-between items-center px-6 py-4 font-bold text-xl cursor-pointer hover:bg-gray-50 transition select-none">
              Технические особенности
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 transition-transform duration-200 group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </summary>
            <div class="px-6 pb-6">
              <div class="bg-gray-50 rounded-lg p-6 mt-2">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4" id="specs-grid"></div>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { initComponents } from './js/components.js';
    initComponents('');
  </script>
  <script type="module" defer src="./data/products.js"></script>
  <script type="module" defer src="./js/product.js"></script>
</body>
</html>
