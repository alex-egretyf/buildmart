<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BuildMart — Категории</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./**/*.{html,js}"],
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FF6200', dark: '#E55A00' },
            gray: {
              50: '#F9FAFB', 100: '#F3F4F6', 200: '#E5E7EB', 300: '#D1D5DB',
              400: '#9CA3AF', 500: '#6B7280', 600: '#4B5563', 700: '#374151',
              800: '#1F2937', 900: '#111827'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">

  <div id="header-root"></div>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-10">
    <nav class="text-sm text-gray-500 mb-6">
      <a href="index.html" class="hover:text-primary">Главная</a> / <span class="text-gray-900 font-medium">Категории</span>
    </nav>

    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-10">Категории товаров</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8" id="categories-grid"></div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { initComponents } from './js/components.js';
    initComponents('categories');
  </script>
  <script type="module" defer src="./data/products.js"></script>
  <script type="module" defer src="./js/categories.js"></script>
</body>
</html>
