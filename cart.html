<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BuildMart — Корзина</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">

  <div id="header-root"></div>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Корзина</h1>

    <div id="cart-content" class="hidden grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2">
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div id="cart-items" class="divide-y"></div>
        </div>

        <div class="mt-6 bg-white rounded-lg shadow p-6">
          <div class="font-medium mb-3">Есть промокод?</div>
          <div class="flex">
            <input id="promo" type="text" placeholder="Введите промокод" class="flex-1 border border-gray-300 rounded-l-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary">
            <button id="apply-promo" class="bg-primary text-white px-8 rounded-r-lg hover:bg-primary-dark transition">Применить</button>
          </div>
          <p id="promo-message" class="text-sm mt-2 min-h-[1.25rem]"></p>
        </div>
      </div>

      <div class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow p-6 sticky top-20">
          <h2 class="text-xl font-bold mb-6">Детали заказа</h2>
          <div class="space-y-4 mb-6">
            <div class="flex justify-between text-gray-700">
              <span>Сумма</span>
              <span id="subtotal">0.00 $</span>
            </div>
            <div class="flex justify-between text-gray-700">
              <span>Налог (8%)</span>
              <span id="tax">0.00 $</span>
            </div>
            <div class="flex justify-between text-gray-700">
              <span>Скидка</span>
              <span id="discount" class="text-green-600">-0.00 $</span>
            </div>
            <div class="border-t pt-4 flex justify-between font-bold text-lg">
              <span>Итого</span>
              <span id="total">0.00 $</span>
            </div>
          </div>
          <button class="w-full bg-primary hover:bg-primary-dark text-white py-4 rounded-lg font-medium text-lg transition mb-4">
            Оформить заказ →
          </button>
          <a href="index.html" class="block text-center text-primary hover:underline">
            Продолжить покупки
          </a>
        </div>
      </div>
    </div>

    <div id="empty-cart" class="text-center py-32">
      <h2 class="text-4xl font-bold text-gray-900 mb-6">Корзина пуста</h2>
      <p class="text-xl text-gray-600 mb-10">Добавьте товары в корзину</p>
      <a href="index.html" class="inline-block bg-primary text-white px-12 py-5 rounded-xl font-medium text-xl hover:bg-primary-dark transition">
        В каталог
      </a>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { initComponents } from './js/components.js';
    initComponents('');
  </script>
  <script type="module" defer src="./data/products.js"></script>
  <script type="module" defer src="./js/cart.js"></script>
</body>
</html>
