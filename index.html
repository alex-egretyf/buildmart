<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BuildMart — Каталог</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./**/*.{html,js}"],
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FF6200', dark: '#E55A00' },
            gray: {
              50: '#F9FAFB', 100: '#F3F4F6', 200: '#E5E7EB', 300: '#D1D5DB',
              400: '#9CA3AF', 500: '#6B7280', 600: '#4B5563', 700: '#374151',
              800: '#1F2937', 900: '#111827'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          boxShadow: {
            'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            'card-hover': '0 10px 15px -3px rgba(255, 98, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col antialiased">

  <div id="header-root"></div>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-10 pt-6"></main>

  <div id="footer-root"></div>

  <script defer src="./js/main.js"></script>
  <script type="module">
    import { initComponents } from './js/components.js';
    initComponents('catalog');
  </script>
  <script type="module" defer src="./data/products.js"></script>
  <script type="module" defer src="./js/catalog.js"></script>
</body>
</html>
