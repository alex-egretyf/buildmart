<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildMart — Каталог</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-3xl font-bold text-primary">BM</a>
      <nav class="hidden md:flex gap-6">
        <a href="index.html" class="text-gray-700 hover:text-primary">Каталог</a>
        <a href="#" class="text-gray-700 hover:text-primary">Категории</a>
        <a href="#" class="text-gray-700 hover:text-primary">Акции</a>
        <a href="#" class="text-gray-700 hover:text-primary">О нас</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-10 pt-20">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Каталог товаров</h1>
        <div class="flex items-center gap-4">
        <label for="sort" class="text-gray-700 font-medium whitespace-nowrap">Сортировка:</label>
        <select id="sort" class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary text-sm">
            <option value="name-asc">По имени (А–Я)</option>
            <option value="name-desc">По имени (Я–А)</option>
            <option value="price-asc">По цене (возр.)</option>
            <option value="price-desc">По цене (убыв.)</option>
        </select>
        </div>
    </div>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 justify-items-center"></div>
    </main>

  <footer class="bg-gray-800 text-gray-300 py-12 text-center">
    © 2025 BuildMart. Все права защищены.
  </footer>

    <script type="module" defer src="./data/products.js"></script>
    <script type="module" defer src="./js/catalog.js"></script>
    <script defer src="./js/main.js"></script>
</body>
</html>
